<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1650" viewBox="0 0 2200 1650">
<defs><marker id="a" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto"><path d="M0,0 L11,3.5 L0,7Z" fill="#263238"/></marker><marker id="d" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto"><path d="M0,0 L11,3.5 L0,7Z" fill="#607d8b"/></marker><style>.title{font:700 31px Arial;fill:#17202a}.h{font:700 20px Arial;fill:#17202a}.b{font:16px Arial;fill:#263238}.s{font:14px Arial;fill:#455a64}.t{font:12px Arial;fill:#455a64}.box{stroke:#263238;stroke-width:2;rx:14}.gray{fill:#f4f6f7}.blue{fill:#dcecff}.purple{fill:#e8ddff}.green{fill:#e5f3df}.orange{fill:#fff0cf}.red{fill:#ffe1df}.dash{fill:none;stroke:#607d8b;stroke-width:2;stroke-dasharray:8 6;rx:18}.ar{fill:none;stroke:#263238;stroke-width:2.5;marker-end:url(#a)}.dr{fill:none;stroke:#607d8b;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#d)}</style></defs>
<rect width="2200" height="1650" fill="white"/><text x="1100" y="46" text-anchor="middle" class="title">PI0.5 TianYi Offline Evaluation Pipeline</text><text x="1100" y="72" text-anchor="middle" class="s">scripts/eval_tianyi.py — deterministic teacher-forced action comparison</text>
<rect x="35" y="110" width="390" height="1300" class="dash"/><text x="230" y="148" text-anchor="middle" class="h">A. Dataset and selection</text>
<rect x="75" y="205" width="310" height="160" class="box gray"/><text x="230" y="243" text-anchor="middle" class="h">Held-out LeRobot eval</text><text x="230" y="276" text-anchor="middle" class="b">--eval-root = tianyi-eval</text><text x="230" y="308" text-anchor="middle" class="b">episodes.jsonl + parquet/video</text><text x="230" y="340" text-anchor="middle" class="s">opened read-only</text>
<rect x="75" y="430" width="310" height="220" class="box blue"/><text x="230" y="468" text-anchor="middle" class="h">Fixed selection</text><text x="230" y="502" text-anchor="middle" class="b">--seed</text><text x="230" y="534" text-anchor="middle" class="b">--episodes-per-task / --max-episodes</text><text x="230" y="566" text-anchor="middle" class="b">--selection-file (replay)</text><text x="230" y="610" text-anchor="middle" class="s">selected_episodes.json</text><path d="M230 365V430" class="ar"/>
<rect x="75" y="715" width="310" height="180" class="box purple"/><text x="230" y="753" text-anchor="middle" class="h">Frame iterator</text><text x="230" y="786" text-anchor="middle" class="b">eval data / video = 15 Hz</text><text x="230" y="818" text-anchor="middle" class="b">GT action chunk, H=10 (0.67 s)</text><text x="230" y="850" text-anchor="middle" class="s">--max-frames optional</text><path d="M230 650V715" class="ar"/>
<rect x="75" y="960" width="310" height="245" class="box orange"/><text x="230" y="998" text-anchor="middle" class="h">Policy infer</text><text x="230" y="1031" text-anchor="middle" class="b">base or fine-tuned checkpoint</text><text x="230" y="1063" text-anchor="middle" class="b">same TianYi repack/transforms</text><text x="230" y="1095" text-anchor="middle" class="b">10-step Euler flow sampling</text><text x="230" y="1127" text-anchor="middle" class="b">prediction [10,32] → first 16D</text><text x="230" y="1170" text-anchor="middle" class="s">one inference per 15-Hz eval frame; teacher-forced</text><path d="M230 895V960" class="ar"/>

<path d="M425 1080H520" class="ar"/><rect x="520" y="110" width="790" height="1300" class="dash"/><text x="915" y="148" text-anchor="middle" class="h">B. Metrics and artifacts</text>
<rect x="575" y="220" width="680" height="205" class="box red"/><text x="915" y="258" text-anchor="middle" class="h">Action alignment and valid mask</text><text x="915" y="293" text-anchor="middle" class="b">difference = prediction − GT</text><text x="915" y="326" text-anchor="middle" class="b">padding/action_is_pad excluded</text><text x="915" y="359" text-anchor="middle" class="b">stationary valid_action_dims = 16</text><text x="915" y="394" text-anchor="middle" class="s">policy output is unnormalized back to original action space</text><path d="M915 425V495" class="ar"/>
<rect x="575" y="495" width="680" height="285" class="box blue"/><text x="915" y="533" text-anchor="middle" class="h">Open-loop action metrics</text><text x="630" y="570" class="b">MAE — mean absolute error</text><text x="630" y="605" class="b">RMSE — root mean squared error</text><text x="630" y="640" class="b">per_dim_mae / per_dim_rmse — each joint/gripper dimension</text><text x="630" y="675" class="b">task_mae — aggregate by task</text><text x="630" y="710" class="b">horizon-wise error — t+1 … t+10 (recommended extension)</text><text x="630" y="750" class="s">current action_mae/action_rmse = mean of 16 valid dimensions; pooled-RMSE is a recommended extension</text><path d="M915 780V850" class="ar"/>
<rect x="575" y="850" width="680" height="240" class="box green"/><text x="915" y="888" text-anchor="middle" class="h">Runtime and reproducibility</text><text x="630" y="925" class="b">policy_timing.infer_ms per frame</text><text x="630" y="960" class="b">selection seed and episode IDs stored</text><text x="630" y="995" class="b">base vs fine-tuned use identical selection</text><text x="630" y="1030" class="s">p50/p95 latency aggregation can be added to report</text><path d="M915 1090V1160" class="ar"/>
<rect x="575" y="1160" width="680" height="190" class="box orange"/><text x="915" y="1198" text-anchor="middle" class="h">Saved output</text><text x="915" y="1231" text-anchor="middle" class="b">metrics.json · episodes.csv · selected_episodes.json</text><text x="915" y="1263" text-anchor="middle" class="b">videos/episode_*.mp4 (optional)</text><text x="915" y="1300" text-anchor="middle" class="s">default video: GT observation annotated with action MAE</text><path d="M915 1350V1410" class="ar"/>

<path d="M1310 1080H1400" class="ar"/><rect x="1400" y="110" width="765" height="1300" class="dash"/><text x="1782" y="148" text-anchor="middle" class="h">C. Interpretation boundary</text>
<rect x="1460" y="235" width="645" height="230" class="box green"/><text x="1782" y="275" text-anchor="middle" class="h">What this evaluation answers</text><text x="1505" y="315" class="b">• How close predicted action chunks are to demonstrations</text><text x="1505" y="350" class="b">• Which dimensions/tasks/horizons are weak</text><text x="1505" y="385" class="b">• Base → fine-tuned regression/improvement</text><text x="1505" y="425" class="s">Useful for model selection and debugging transforms</text>
<rect x="1460" y="555" width="645" height="230" class="box red"/><text x="1782" y="595" text-anchor="middle" class="h">What it does not answer</text><text x="1505" y="635" class="b">• No contact dynamics or environment state update</text><text x="1505" y="670" class="b">• No task success/failure predicate</text><text x="1505" y="705" class="b">• No closed-loop compounding error</text><text x="1505" y="750" class="s">offline teacher-forced ≠ Isaac/real-robot success rate</text>
<rect x="1460" y="875" width="645" height="250" class="box orange"/><text x="1782" y="915" text-anchor="middle" class="h">Optional cloud/server path</text><text x="1505" y="955" class="b">checkpoint + config → serve_policy.py</text><text x="1505" y="990" class="b">WebsocketPolicyServer → remote client</text><text x="1505" y="1025" class="b">returns action chunk [10,32]</text><text x="1505" y="1060" class="s">server does not impose final execution Hz; client must schedule it</text><path d="M1782 465V555" class="dr"/><path d="M1782 785V875" class="dr"/>
<rect x="1460" y="1215" width="645" height="135" class="box gray"/><text x="1782" y="1255" text-anchor="middle" class="h">Next closed-loop stage</text><text x="1782" y="1288" text-anchor="middle" class="b">Isaac TianYi bridge + scorer + rollout video</text><text x="1782" y="1322" text-anchor="middle" class="s">shown as dashed because PI0.5 bridge is not yet complete</text>
<text x="35" y="1565" class="t">The default script does not generate side-by-side comparison video unless --comparison-video is explicitly passed.</text>
</svg>
