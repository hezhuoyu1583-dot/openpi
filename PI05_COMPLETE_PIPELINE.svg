<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1900" viewBox="0 0 2400 1900">
<defs><marker id="a" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto"><path d="M0,0 L11,3.5 L0,7Z" fill="#263238"/></marker><marker id="d" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto"><path d="M0,0 L11,3.5 L0,7Z" fill="#607d8b"/></marker><style>.title{font:700 32px Arial;fill:#17202a}.h{font:700 20px Arial;fill:#17202a}.b{font:16px Arial;fill:#263238}.s{font:14px Arial;fill:#455a64}.t{font:12px Arial;fill:#455a64}.box{stroke:#263238;stroke-width:2;rx:14}.gray{fill:#f4f6f7}.blue{fill:#dcecff}.purple{fill:#e8ddff}.green{fill:#e5f3df}.orange{fill:#fff0cf}.red{fill:#ffe1df}.dash{fill:none;stroke:#607d8b;stroke-width:2;stroke-dasharray:8 6;rx:18}.ar{fill:none;stroke:#263238;stroke-width:2.5;marker-end:url(#a)}.dr{fill:none;stroke:#607d8b;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#d)}</style></defs>
<rect width="2400" height="1900" fill="white"/><text x="1200" y="48" text-anchor="middle" class="title">PI0.5 TianYi End-to-End Pipeline</text><text x="1200" y="75" text-anchor="middle" class="s">Data → model → post-training → offline evaluation → serving → Isaac closed-loop</text>
<rect x="35" y="120" width="410" height="1540" class="dash"/><text x="240" y="158" text-anchor="middle" class="h">Data and embodiment</text><rect x="80" y="215" width="320" height="180" class="box gray"/><text x="240" y="255" text-anchor="middle" class="h">TianYi datasets</text><text x="240" y="290" text-anchor="middle" class="b">stationary train / eval</text><text x="240" y="323" text-anchor="middle" class="b">mobile train / eval interface</text><text x="240" y="360" text-anchor="middle" class="s">LeRobot v2.1 conversion</text><rect x="80" y="470" width="320" height="240" class="box green"/><text x="240" y="510" text-anchor="middle" class="h">TianyiPolicy layouts</text><text x="240" y="546" text-anchor="middle" class="b">stationary: 16D</text><text x="240" y="579" text-anchor="middle" class="b">mobile: 25D</text><text x="240" y="612" text-anchor="middle" class="b">model pad: 32D</text><text x="240" y="655" text-anchor="middle" class="s">head camera; wrist slots masked</text><rect x="80" y="785" width="320" height="240" class="box orange"/><text x="240" y="825" text-anchor="middle" class="h">Action convention</text><text x="240" y="861" text-anchor="middle" class="b">current training: absolute</text><text x="240" y="895" text-anchor="middle" class="b">use_delta_joint_actions=False</text><text x="240" y="929" text-anchor="middle" class="b">optional arm delta transform</text><text x="240" y="970" text-anchor="middle" class="s">explicit embodiment prevents silent mix-up</text><path d="M240 395V470" class="ar"/><path d="M240 710V785" class="ar"/>

<path d="M445 900H520" class="ar"/><rect x="520" y="120" width="540" height="1540" class="dash"/><text x="790" y="158" text-anchor="middle" class="h">PI0.5 model and training</text><rect x="580" y="215" width="420" height="230" class="box purple"/><text x="790" y="255" text-anchor="middle" class="h">PaliGemma + SigLIP</text><text x="790" y="292" text-anchor="middle" class="b">image + prompt + discrete state</text><text x="790" y="326" text-anchor="middle" class="b">prefix tokens / cached KV</text><text x="790" y="362" text-anchor="middle" class="s">gemma_2b language/vision backbone</text><rect x="580" y="520" width="420" height="230" class="box orange"/><text x="790" y="560" text-anchor="middle" class="h">Gemma 300M action expert</text><text x="790" y="596" text-anchor="middle" class="b">action_in_proj → suffix tokens</text><text x="790" y="630" text-anchor="middle" class="b">adaRMSNorm(t) → vector field</text><text x="790" y="666" text-anchor="middle" class="b">action_out_proj → 32D</text><rect x="580" y="825" width="420" height="205" class="box red"/><text x="790" y="865" text-anchor="middle" class="h">Flow matching</text><text x="790" y="900" text-anchor="middle" class="b">xₜ=tε+(1−t)a; target uₜ=ε−a</text><text x="790" y="934" text-anchor="middle" class="b">MSE(uₜ,vₜ), valid action mask</text><text x="790" y="972" text-anchor="middle" class="s">Euler inference uses 10 integration steps</text><rect x="580" y="1105" width="420" height="255" class="box green"/><text x="790" y="1145" text-anchor="middle" class="h">Fine-tune checkpoint</text><text x="790" y="1180" text-anchor="middle" class="b">pi05_base_pytorch → TianYi</text><text x="790" y="1214" class="b">30k steps · batch 32 · bf16</text><text x="790" y="1248" class="b">LR 5e−5, warmup 1k</text><text x="790" y="1282" class="b">keep max 5 checkpoints</text><text x="790" y="1320" class="s">default all parameters trainable</text><path d="M790 445V520" class="ar"/><path d="M790 750V825" class="ar"/><path d="M790 1030V1105" class="ar"/>

<path d="M1060 900H1135" class="ar"/><rect x="1135" y="120" width="540" height="1540" class="dash"/><text x="1405" y="158" text-anchor="middle" class="h">Offline evaluation and serving</text><rect x="1195" y="215" width="420" height="220" class="box blue"/><text x="1405" y="255" text-anchor="middle" class="h">eval_tianyi.py</text><text x="1405" y="292" text-anchor="middle" class="b">fixed seed / selected episodes</text><text x="1405" y="326" text-anchor="middle" class="b">teacher-forced inference</text><text x="1405" y="360" text-anchor="middle" class="s">same eval split for base vs fine-tuned</text><rect x="1195" y="510" width="420" height="220" class="box green"/><text x="1405" y="550" text-anchor="middle" class="h">Metrics and videos</text><text x="1405" y="586" text-anchor="middle" class="b">MAE / RMSE / per-dim / task</text><text x="1405" y="620" text-anchor="middle" class="b">metrics.json + episodes.csv</text><text x="1405" y="654" text-anchor="middle" class="b">annotated observation videos</text><text x="1405" y="690" text-anchor="middle" class="s">not a physical success rate</text><rect x="1195" y="805" width="420" height="220" class="box purple"/><text x="1405" y="845" text-anchor="middle" class="h">serve_policy.py</text><text x="1405" y="881" text-anchor="middle" class="b">checkpoint + config → policy</text><text x="1405" y="915" class="b">WebsocketPolicyServer</text><text x="1405" y="949" class="b">returns [10,32] action chunk</text><text x="1405" y="987" class="s">logs infer_ms</text><path d="M1405 435V510" class="ar"/><path d="M1405 730V805" class="ar"/>

<path d="M1675 900H1750" class="dr"/><rect x="1750" y="120" width="610" height="1540" class="dash"/><text x="2055" y="158" text-anchor="middle" class="h">Isaac closed-loop (integration)</text><rect x="1810" y="215" width="490" height="220" class="box purple"/><text x="2055" y="255" text-anchor="middle" class="h">TianYi2-BrainCo2 Isaac</text><text x="2055" y="292" text-anchor="middle" class="b">USD/task + ZMQ observation</text><text x="2055" y="326" text-anchor="middle" class="b">head camera + native 26D state</text><text x="2055" y="365" text-anchor="middle" class="s">smoke startup/transport exists</text><rect x="1810" y="510" width="490" height="260" class="box orange"/><text x="2055" y="550" text-anchor="middle" class="h">PI0.5 TianYi adapter</text><text x="2055" y="587" text-anchor="middle" class="b">26D Isaac ↔ 16/25D model layout</text><text x="2055" y="621" text-anchor="middle" class="b">gripper scalar ↔ BrainCo hand6</text><text x="2055" y="655" text-anchor="middle" class="b">scheduler + safety limits</text><text x="2055" y="706" text-anchor="middle" class="s">not yet complete</text><rect x="1810" y="845" width="490" height="220" class="box red"/><text x="2055" y="885" text-anchor="middle" class="h">Closed-loop rollout</text><text x="2055" y="922" text-anchor="middle" class="b">action → physics → next obs</text><text x="2055" y="956" text-anchor="middle" class="b">success/timeout/safety predicate</text><text x="2055" y="1000" text-anchor="middle" class="s">requires scorer and recording</text><rect x="1810" y="1140" width="490" height="245" class="box gray"/><text x="2055" y="1180" text-anchor="middle" class="h">Decision boundary</text><text x="2055" y="1217" text-anchor="middle" class="b">offline action error ≠ success rate</text><text x="2055" y="1251" text-anchor="middle" class="b">base vs fine-tuned closed-loop</text><text x="2055" y="1285" text-anchor="middle" class="b">only after adapter/calibration</text><text x="2055" y="1330" text-anchor="middle" class="s">all arrows here are planned/dashed</text><path d="M2055 435V510" class="dr"/><path d="M2055 770V845" class="dr"/><path d="M2055 1065V1140" class="dr"/>
<text x="35" y="1740" class="t">Solid arrows are implemented openpi data/model/evaluation/serving paths. Dashed arrows and orange/red Isaac stages identify the remaining integration work.</text><text x="35" y="1770" class="t">PyTorch note: default freeze_filter is not applied by train_pytorch.py; all model parameters are optimized, and EMA is not supported.</text>
<rect x="520" y="1690" width="1840" height="105" class="box gray"/><text x="1440" y="1725" text-anchor="middle" class="h">Timing summary</text><text x="1440" y="1755" text-anchor="middle" class="b">TianYi data/eval = 15 Hz; PI0.5 H=10 = 0.67 s at training time base; no RTG/reward/discount</text><text x="1440" y="1782" text-anchor="middle" class="s">Isaac physics = 120 Hz, current observation publication ≈30 Hz; final PI0.5 action execution rate is a bridge/client decision (recommended 15 Hz alignment, not yet implemented)</text></svg>
