<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1750" viewBox="0 0 2200 1750">
<defs><marker id="a" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto"><path d="M0,0 L11,3.5 L0,7Z" fill="#263238"/></marker><marker id="d" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto"><path d="M0,0 L11,3.5 L0,7Z" fill="#607d8b"/></marker><style>.title{font:700 31px Arial;fill:#17202a}.h{font:700 20px Arial;fill:#17202a}.b{font:16px Arial;fill:#263238}.s{font:14px Arial;fill:#455a64}.t{font:12px Arial;fill:#455a64}.box{stroke:#263238;stroke-width:2;rx:14}.gray{fill:#f4f6f7}.blue{fill:#dcecff}.purple{fill:#e8ddff}.green{fill:#e5f3df}.orange{fill:#fff0cf}.red{fill:#ffe1df}.dash{fill:none;stroke:#607d8b;stroke-width:2;stroke-dasharray:8 6;rx:18}.ar{fill:none;stroke:#263238;stroke-width:2.5;marker-end:url(#a)}.dr{fill:none;stroke:#607d8b;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#d)}</style></defs>
<rect width="2200" height="1750" fill="white"/><text x="1100" y="46" text-anchor="middle" class="title">PI0.5 × TianYi Isaac Simulation Pipeline</text><text x="1100" y="72" text-anchor="middle" class="s">Current smoke path is implemented; PI0.5 closed-loop bridge and scorer remain integration work</text>
<rect x="35" y="110" width="500" height="1450" class="dash"/><text x="285" y="148" text-anchor="middle" class="h">1. Isaac TianYi2-BrainCo2 world</text>
<rect x="85" y="205" width="400" height="190" class="box purple"/><text x="285" y="245" text-anchor="middle" class="h">Isaac USD / task</text><text x="285" y="280" text-anchor="middle" class="b">TianYi2_Brainco2 robot</text><text x="285" y="313" text-anchor="middle" class="b">task suite / position controller</text><text x="285" y="348" text-anchor="middle" class="s">benchmark repo: x-humanoid-vla-simulation-benchmark</text>
<rect x="85" y="465" width="400" height="220" class="box blue"/><text x="285" y="505" text-anchor="middle" class="h">Observation publisher</text><text x="285" y="540" text-anchor="middle" class="b">physics = 120 Hz (dt=1/120 s)</text><text x="285" y="573" text-anchor="middle" class="b">collect every 4 physics steps ≈ 30 Hz</text><text x="285" y="606" text-anchor="middle" class="b">camera_head config = 30 Hz</text><text x="285" y="650" text-anchor="middle" class="s">ZMQ obs: RGB + current state; smoke validates transport</text><path d="M285 395V465" class="ar"/>
<rect x="85" y="755" width="400" height="290" class="box green"/><text x="285" y="795" text-anchor="middle" class="h">Native Isaac action/state layout</text><text x="285" y="832" text-anchor="middle" class="b">26D = L_arm7 + L_hand6</text><text x="285" y="866" text-anchor="middle" class="b">      + R_arm7 + R_hand6</text><text x="285" y="904" text-anchor="middle" class="b">position targets / limits</text><text x="285" y="941" text-anchor="middle" class="s">hand model is 6D BrainCo control</text><text x="285" y="980" text-anchor="middle" class="s">current smoke policy can send safe no-op/trajectory</text><path d="M285 685V755" class="ar"/>
<rect x="85" y="1115" width="400" height="260" class="box gray"/><text x="285" y="1155" text-anchor="middle" class="h">Current evidence</text><text x="285" y="1190" text-anchor="middle" class="b">tools/run_tianyi_isaac_smoke.sh</text><text x="285" y="1225" text-anchor="middle" class="b">tools/tianyi_isaac_smoke.py</text><text x="285" y="1262" text-anchor="middle" class="b">pi05_smoke_policy.py (stub/smoke)</text><text x="285" y="1300" text-anchor="middle" class="s">USD/task startup and ZMQ path checked</text><text x="285" y="1335" text-anchor="middle" class="s">not a PI0.5 policy success benchmark</text><path d="M285 1045V1115" class="ar"/>

<path d="M535 900H640" class="ar"/><rect x="640" y="110" width="720" height="1450" class="dash"/><text x="1000" y="148" text-anchor="middle" class="h">2. PI0.5 policy bridge (required)</text>
<rect x="700" y="205" width="600" height="250" class="box orange"/><text x="1000" y="245" text-anchor="middle" class="h">TianYi Isaac adapter</text><text x="1000" y="280" text-anchor="middle" class="b">camera_head → base_0_rgb (224×224 RGB)</text><text x="1000" y="315" text-anchor="middle" class="b">26D native state → model state contract</text><text x="1000" y="350" text-anchor="middle" class="b">stationary model: select L/R arm7 + gripper scalars</text><text x="1000" y="388" text-anchor="middle" class="s">mobile model extension can include chassis/head dimensions</text><text x="1000" y="422" text-anchor="middle" class="s">IMPLEMENTATION NEEDED — currently dashed</text>
<rect x="700" y="525" width="600" height="220" class="box orange"/><text x="1000" y="565" text-anchor="middle" class="h">WebSocket / Policy.infer</text><text x="1000" y="600" text-anchor="middle" class="b">serve_policy.py → WebsocketPolicyServer</text><text x="1000" y="634" text-anchor="middle" class="b">PI0.5 checkpoint: base or TianYi fine-tune</text><text x="1000" y="668" text-anchor="middle" class="b">returns action chunk [10,32]</text><text x="1000" y="710" text-anchor="middle" class="s">10 Euler flow steps per inference (configurable)</text><path d="M1000 455V525" class="dr"/>
<rect x="700" y="815" width="600" height="250" class="box red"/><text x="1000" y="855" text-anchor="middle" class="h">Action adapter and scheduler</text><text x="1000" y="890" text-anchor="middle" class="b">PI0.5 valid output: 16D stationary</text><text x="1000" y="925" text-anchor="middle" class="b">[L_arm7, R_arm7, L_scalar, R_scalar]</text><text x="1000" y="960" text-anchor="middle" class="b">→ Isaac [L_arm7,L_hand6,R_arm7,R_hand6]</text><text x="1000" y="1000" text-anchor="middle" class="s">proposed execution: consume one action at 30 Hz</text><text x="1000" y="1035" text-anchor="middle" class="s">chunk refresh ≈ 3 Hz if all 10 actions are consumed; limits/stop required</text><path d="M1000 745V815" class="dr"/>
<rect x="700" y="1135" width="600" height="250" class="box gray"/><text x="1000" y="1175" text-anchor="middle" class="h">Hand calibration + safety layer</text><text x="1000" y="1210" text-anchor="middle" class="b">scalar gripper → BrainCo hand6 mapping</text><text x="1000" y="1245" text-anchor="middle" class="b">calibrate sign, range, coupling and limits</text><text x="1000" y="1280" text-anchor="middle" class="b">clip / rate limit / stale-action watchdog</text><text x="1000" y="1320" text-anchor="middle" class="s">required before physical-quality claims</text><path d="M1000 1065V1135" class="dr"/>

<path d="M1360 900H1465" class="dr"/><rect x="1465" y="110" width="700" height="1450" class="dash"/><text x="1815" y="148" text-anchor="middle" class="h">3. Rollout, scoring and evidence</text>
<rect x="1525" y="205" width="580" height="220" class="box blue"/><text x="1815" y="245" text-anchor="middle" class="h">Closed-loop rollout</text><text x="1815" y="280" text-anchor="middle" class="b">Isaac physics 120 Hz; obs/action interface ≈30 Hz</text><text x="1815" y="315" text-anchor="middle" class="b">PI0.5 chunk H=10; 30-Hz consumption ≈0.33 s/chunk</text><text x="1815" y="350" text-anchor="middle" class="s">prediction errors can compound; exact refresh policy is TBD</text><text x="1815" y="388" text-anchor="middle" class="s">IMPLEMENTATION NEEDED</text><path d="M1815 425V505" class="dr"/>
<rect x="1525" y="505" width="580" height="250" class="box red"/><text x="1815" y="545" text-anchor="middle" class="h">Official scorer / predicates</text><text x="1815" y="580" text-anchor="middle" class="b">task success, timeout, safety violation</text><text x="1815" y="615" text-anchor="middle" class="b">episode return / completion rate</text><text x="1815" y="650" text-anchor="middle" class="b">base vs fine-tuned, fixed seeds</text><text x="1815" y="700" text-anchor="middle" class="s">not present in open-loop eval_tianyi.py</text><path d="M1815 755V835" class="dr"/>
<rect x="1525" y="835" width="580" height="230" class="box green"/><text x="1815" y="875" text-anchor="middle" class="h">Rollout artifacts</text><text x="1815" y="910" text-anchor="middle" class="b">RGB/video + action/state trace</text><text x="1815" y="945" text-anchor="middle" class="b">metrics.json / success summary</text><text x="1815" y="980" text-anchor="middle" class="s">separate from teacher-forced annotated videos</text><text x="1815" y="1020" text-anchor="middle" class="s">IMPLEMENTATION NEEDED</text><path d="M1815 1065V1145" class="dr"/>
<rect x="1525" y="1145" width="580" height="240" class="box orange"/><text x="1815" y="1185" text-anchor="middle" class="h">Acceptance gate</text><text x="1815" y="1220" text-anchor="middle" class="b">camera format / calibration verified</text><text x="1815" y="1255" text-anchor="middle" class="b">latency and action freshness logged</text><text x="1815" y="1290" text-anchor="middle" class="b">unsafe actions blocked</text><text x="1815" y="1330" text-anchor="middle" class="s">Only then report Isaac closed-loop success</text><path d="M1815 1385V1455" class="dr"/>
<text x="35" y="1665" class="t">Solid arrows: existing Isaac smoke/transport components. Dashed arrows and orange/red stages: PI0.5 adapter, calibration, scheduler, scorer and rollout evidence still need implementation.</text><rect x="35" y="1690" width="2130" height="45" class="box gray"/><text x="1100" y="1718" text-anchor="middle" class="t">Timing clarification: physics 120 Hz; current obs publication ≈30 Hz (every 4 physics ticks); TianYi training data 15 Hz; PI0.5 H=10 spans ≈0.67 s on that data clock; final action execution/refresh rate is not implemented (start with 15 Hz, hold each target for 8 physics ticks).</text>
</svg>
