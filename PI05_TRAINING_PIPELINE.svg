<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1800" viewBox="0 0 2200 1800">
<defs><marker id="a" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto"><path d="M0,0 L11,3.5 L0,7Z" fill="#263238"/></marker><marker id="d" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto"><path d="M0,0 L11,3.5 L0,7Z" fill="#607d8b"/></marker><style>.title{font:700 31px Arial;fill:#17202a}.h{font:700 20px Arial;fill:#17202a}.b{font:16px Arial;fill:#263238}.s{font:14px Arial;fill:#455a64}.t{font:12px Arial;fill:#455a64}.box{stroke:#263238;stroke-width:2;rx:14}.gray{fill:#f4f6f7}.blue{fill:#dcecff}.purple{fill:#e8ddff}.green{fill:#e5f3df}.orange{fill:#fff0cf}.red{fill:#ffe1df}.dash{fill:none;stroke:#607d8b;stroke-width:2;stroke-dasharray:8 6;rx:18}.ar{fill:none;stroke:#263238;stroke-width:2.5;marker-end:url(#a)}.dr{fill:none;stroke:#607d8b;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#d)}</style></defs>
<rect width="2200" height="1800" fill="white"/><text x="1100" y="46" text-anchor="middle" class="title">PI0.5 TianYi Post-training Pipeline</text><text x="1100" y="72" text-anchor="middle" class="s">LeRobot v2.1 → Tianyi transforms → PyTorch flow-matching fine-tune</text>

<rect x="35" y="105" width="360" height="1370" class="dash"/><text x="215" y="143" text-anchor="middle" class="h">1. Read-only data source</text>
<rect x="70" y="185" width="290" height="170" class="box gray"/><text x="215" y="222" text-anchor="middle" class="h">LeRobot v2.1</text><text x="215" y="254" text-anchor="middle" class="b">repo_id = tianyi</text><text x="215" y="283" text-anchor="middle" class="b">train root: tianyi_lerobot_v21_overlay</text><text x="215" y="315" text-anchor="middle" class="s">episodes / parquet / camera video</text>
<rect x="70" y="410" width="290" height="170" class="box blue"/><text x="215" y="447" text-anchor="middle" class="h">Episode sampler</text><text x="215" y="480" text-anchor="middle" class="b">dataset / action frequency = 15 Hz</text><text x="215" y="512" text-anchor="middle" class="b">H = action_horizon = 10</text><text x="215" y="544" text-anchor="middle" class="s">10 actions cover 0.67 s; last timestamp t+0.60 s</text><path d="M215 355V410" class="ar"/>
<rect x="70" y="635" width="290" height="190" class="box purple"/><text x="215" y="672" text-anchor="middle" class="h">RepackTransform</text><text x="215" y="705" text-anchor="middle" class="b">camera_top → observation/image</text><text x="215" y="737" text-anchor="middle" class="b">observation.state → state</text><text x="215" y="769" text-anchor="middle" class="b">action → actions</text><text x="215" y="801" text-anchor="middle" class="s">task → prompt</text><path d="M215 580V635" class="ar"/>
<rect x="70" y="880" width="290" height="260" class="box green"/><text x="215" y="917" text-anchor="middle" class="h">TianyiInputs</text><text x="215" y="950" text-anchor="middle" class="b">stationary layout: 16D</text><text x="215" y="981" text-anchor="middle" class="b">mobile interface: 25D</text><text x="215" y="1014" text-anchor="middle" class="b">camera_head → base_0_rgb</text><text x="215" y="1047" text-anchor="middle" class="b">wrist images = zero</text><text x="215" y="1080" text-anchor="middle" class="s">wrist image_mask = False</text><text x="215" y="1112" text-anchor="middle" class="s">action_dim_mask excludes padding</text><path d="M215 825V880" class="ar"/>
<rect x="70" y="1195" width="290" height="220" class="box orange"/><text x="215" y="1232" text-anchor="middle" class="h">Action convention</text><text x="215" y="1265" text-anchor="middle" class="b">use_delta_joint_actions=False</text><text x="215" y="1297" text-anchor="middle" class="b">raw master actions = absolute</text><text x="215" y="1330" text-anchor="middle" class="b">model width: 32D</text><text x="215" y="1362" text-anchor="middle" class="s">stationary valid 16D; pad 16D</text><path d="M215 1140V1195" class="ar"/>

<path d="M395 820H500" class="ar"/>
<rect x="500" y="105" width="820" height="1370" class="dash"/><text x="910" y="143" text-anchor="middle" class="h">2. Model-side transforms and flow target</text>
<rect x="560" y="200" width="700" height="160" class="box purple"/><text x="910" y="238" text-anchor="middle" class="h">ModelTransformFactory (PI0.5)</text><text x="910" y="272" text-anchor="middle" class="b">InjectDefaultPrompt → ResizeImages(224,224)</text><text x="910" y="304" text-anchor="middle" class="b">PaligemmaTokenizer(discrete_state_input=True)</text><text x="910" y="336" text-anchor="middle" class="b">PadStatesAndActions(32)</text>
<rect x="560" y="430" width="330" height="165" class="box blue"/><text x="725" y="468" text-anchor="middle" class="h">Normalize</text><text x="725" y="501" text-anchor="middle" class="b">checkpoint norm_stats</text><text x="725" y="533" text-anchor="middle" class="s">z-score by default</text><text x="725" y="565" text-anchor="middle" class="s">quantile option available</text>
<rect x="930" y="430" width="330" height="165" class="box gray"/><text x="1095" y="468" text-anchor="middle" class="h">Training batch</text><text x="1095" y="501" text-anchor="middle" class="b">global batch_size = 32</text><text x="1095" y="533" text-anchor="middle" class="b">PyTorch bfloat16</text><text x="1095" y="565" text-anchor="middle" class="s">distributed loader / workers=2</text><path d="M910 360V430" class="ar"/><path d="M725 595V690" class="ar"/><path d="M1095 595V690" class="ar"/>
<rect x="560" y="690" width="700" height="210" class="box orange"/><text x="910" y="730" text-anchor="middle" class="h">Flow-matching target construction</text><text x="910" y="768" text-anchor="middle" class="b">ε ~ N(0,I),  t ~ Beta(1.5,1.0) → [0.001, 1]</text><text x="910" y="803" text-anchor="middle" class="b">xₜ = t·ε + (1−t)·a ;  uₜ = ε − a</text><text x="910" y="838" text-anchor="middle" class="s">action/noise [B,10,32]; 10-action control span 0.67 s (timestamps span 0.60 s)</text><text x="910" y="870" text-anchor="middle" class="s">No RTG/reward/discount/advantage path in this SFT</text>
<rect x="560" y="995" width="700" height="180" class="box red"/><text x="910" y="1033" text-anchor="middle" class="h">PI0.5 forward + masked loss</text><text x="910" y="1068" text-anchor="middle" class="b">PaliGemma prefix + Gemma 300M action expert</text><text x="910" y="1100" text-anchor="middle" class="b">adaRMSNorm receives time embedding</text><text x="910" y="1132" text-anchor="middle" class="b">MSE(uₜ, vₜ), unreduced per token/dimension</text><text x="910" y="1160" text-anchor="middle" class="s">valid dimensions only for TianYi metrics/loss</text><path d="M910 900V995" class="ar"/>
<rect x="560" y="1270" width="700" height="145" class="box green"/><text x="910" y="1308" text-anchor="middle" class="h">Optimizer / logging</text><text x="910" y="1340" text-anchor="middle" class="b">AdamW; gradient clip norm = 1.0</text><text x="910" y="1372" text-anchor="middle" class="b">warmup=1,000; peak LR=5e−5</text><text x="910" y="1404" text-anchor="middle" class="s">cosine decay 30,000 steps → 5e−6; EMA is not supported in PyTorch path</text><path d="M910 1175V1270" class="ar"/>

<path d="M1320 820H1425" class="ar"/>
<rect x="1425" y="105" width="740" height="1370" class="dash"/><text x="1795" y="143" text-anchor="middle" class="h">3. Checkpoint and reproducibility</text>
<rect x="1490" y="220" width="610" height="180" class="box blue"/><text x="1795" y="258" text-anchor="middle" class="h">Initialization</text><text x="1795" y="292" text-anchor="middle" class="b">pi05_base_pytorch/model.safetensors</text><text x="1795" y="326" text-anchor="middle" class="b">/data/checkpoints/pi05_base_pytorch</text><text x="1795" y="360" text-anchor="middle" class="s">load base weights, then fine-tune</text>
<rect x="1490" y="475" width="610" height="190" class="box orange"/><text x="1795" y="513" text-anchor="middle" class="h">TrainConfig: pi05_tianyi_finetune</text><text x="1795" y="548" text-anchor="middle" class="b">num_train_steps = 30,000</text><text x="1795" y="580" text-anchor="middle" class="b">save_interval = 1,000</text><text x="1795" y="612" text-anchor="middle" class="b">max_checkpoints = 5</text><text x="1795" y="644" text-anchor="middle" class="s">default freeze_filter = Nothing → all params trainable</text><path d="M1795 400V475" class="ar"/>
<rect x="1490" y="740" width="610" height="210" class="box green"/><text x="1795" y="778" text-anchor="middle" class="h">Output checkpoint</text><text x="1795" y="812" text-anchor="middle" class="b">data/checkpoints/pi05_tianyi_finetune/&lt;exp&gt;</text><text x="1795" y="844" text-anchor="middle" class="b">model.safetensors + assets/norm_stats</text><text x="1795" y="876" text-anchor="middle" class="b">training metrics / config metadata</text><text x="1795" y="916" text-anchor="middle" class="s">old completed checkpoints pruned automatically</text><path d="M1795 665V740" class="ar"/>
<rect x="1490" y="1030" width="610" height="265" class="box gray"/><text x="1795" y="1068" text-anchor="middle" class="h">Known operational checks</text><text x="1530" y="1105" class="b">• LeRobot index/timestamps must be consistent</text><text x="1530" y="1140" class="b">• video backend: pyav avoids torchcodec/FFmpeg issues</text><text x="1530" y="1175" class="b">• tokenizer cache: OPENPI_DATA_HOME/.openpi_cache</text><text x="1530" y="1210" class="b">• HF cache redirected to persistent data volume</text><text x="1530" y="1245" class="s">source data remains read-only</text><path d="M1795 950V1030" class="ar"/>
<text x="35" y="1690" class="t">Solid arrows: implemented code path. Dashed containers: logical stages. This diagram describes the current openpi implementation, not a claim of closed-loop success.</text>
</svg>
